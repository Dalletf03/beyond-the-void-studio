<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#08051d}
svg{width:1280px;height:720px;display:block}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1280 720"
xmlns="http://www.w3.org/2000/svg">
<defs>
 <radialGradient id="space">
  <stop stop-color="#17104a"/>
  <stop offset=".55" stop-color="#0b0a32"/>
  <stop offset="1" stop-color="#05051b"/>
 </radialGradient>
 <radialGradient id="core">
  <stop stop-color="#ffffff"/>
  <stop offset=".23" stop-color="#fffbd0"/>
  <stop offset=".55" stop-color="#ffe65c"/>
  <stop offset="1" stop-color="#ff9c36" stop-opacity=".15"/>
 </radialGradient>
 <radialGradient id="halo">
  <stop stop-color="#ffb5e8" stop-opacity=".55"/>
  <stop offset=".5" stop-color="#9c36df" stop-opacity=".2"/>
  <stop offset="1" stop-color="#5222d8" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#ff75bd"/>
  <stop offset=".5" stop-color="#e82b9b"/>
  <stop offset="1" stop-color="#9e2bba"/>
 </linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#fff078"/>
  <stop offset=".5" stop-color="#ff9b3d"/>
  <stop offset="1" stop-color="#f04478"/>
 </linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#51c9ff"/>
  <stop offset=".5" stop-color="#3657ff"/>
  <stop offset="1" stop-color="#7136d8"/>
 </linearGradient>
 <filter id="soft">
  <feGaussianBlur stdDeviation="22"/>
 </filter>
 <filter id="glow">
  <feGaussianBlur stdDeviation="7"/>
 </filter>
</defs>

<rect width="1280" height="720" fill="url(#space)"/>
<g id="nebula" opacity=".8">
 <ellipse cx="630" cy="350" rx="490" ry="260"
 fill="#4820a8" opacity=".22" filter="url(#soft)"/>
 <circle cx="340" cy="210" r="170"
 fill="#b327a7" opacity=".14" filter="url(#soft)"/>
 <circle cx="940" cy="490" r="190"
 fill="#244cda" opacity=".16" filter="url(#soft)"/>
</g>

<g id="stars"></g>

<g id="camera">
 <g id="galaxy" transform="rotate(-13 640 360)">
  <!-- outer blue orbital sweeps -->
  <ellipse cx="640" cy="360" rx="480" ry="145"
   fill="none" stroke="#243bd8" stroke-width="22"
   stroke-linecap="round" stroke-dasharray="720 150 300 180"
   opacity=".9"/>
  <ellipse cx="640" cy="360" rx="445" ry="128"
   fill="none" stroke="url(#blue)" stroke-width="13"
   stroke-linecap="round" stroke-dasharray="560 95 250 150"
   opacity=".95"/>
  <ellipse cx="640" cy="360" rx="395" ry="112"
   fill="none" stroke="#7435d4" stroke-width="24"
   stroke-linecap="round" stroke-dasharray="510 120 320 130"
   opacity=".9"/>

  <!-- violet outer galaxy -->
  <ellipse cx="640" cy="360" rx="355" ry="103"
   fill="#7627a5" opacity=".95"/>
  <ellipse cx="640" cy="360" rx="328" ry="91"
   fill="none" stroke="#bd35a6" stroke-width="19"
   stroke-dasharray="480 60 260 110"
   stroke-linecap="round"/>

  <!-- pink and red inner bands -->
  <ellipse cx="640" cy="360" rx="285" ry="78"
   fill="url(#pink)"/>
  <ellipse cx="640" cy="360" rx="254" ry="67"
   fill="#f04a91"/>
  <ellipse cx="640" cy="360" rx="220" ry="57"
   fill="url(#orange)"/>

  <!-- warm yellow inner spiral bands -->
  <ellipse cx="640" cy="360" rx="180" ry="44"
   fill="#ffdc58"/>
  <ellipse cx="640" cy="360" rx="144" ry="34"
   fill="#ffec7a"/>
  <ellipse cx="640" cy="360" rx="91" ry="24"
   fill="url(#core)"/>

  <!-- bright centre -->
  <ellipse cx="640" cy="360" rx="55" ry="20"
   fill="#fff9dd" filter="url(#glow)" opacity=".8"/>
  <ellipse cx="640" cy="360" rx="44" ry="16"
   fill="#fffdf0"/>
  <ellipse cx="640" cy="360" rx="25" ry="9"
   fill="#ffffff"/>

  <!-- graphic streaks -->
  <g fill="none" stroke-linecap="round">
   <path d="M330 326 Q430 246 550 276"
    stroke="#ffbd61" stroke-width="13"/>
   <path d="M715 279 Q835 260 920 312"
    stroke="#ff6eb5" stroke-width="12"/>
   <path d="M405 421 Q520 470 615 430"
    stroke="#f64e9d" stroke-width="10"/>
   <path d="M740 420 Q860 438 960 384"
    stroke="#4b83ff" stroke-width="12"/>
   <path d="M515 302 Q580 268 628 281"
    stroke="#fff28a" stroke-width="8"/>
   <path d="M680 302 Q748 282 790 306"
    stroke="#fff078" stroke-width="7"/>
   <path d="M540 394 Q610 420 665 405"
    stroke="#ff9d47" stroke-width="8"/>
  </g>

  <!-- little orbit fragments -->
  <g fill="#ff75b9">
   <rect x="290" y="355" width="40" height="12" rx="6"/>
   <rect x="875" y="340" width="48" height="12" rx="6"/>
   <rect x="470" y="451" width="35" height="10" rx="5"/>
  </g>
  <g fill="#4779ff">
   <rect x="245" y="300" width="46" height="11" rx="6"/>
   <rect x="925" y="410" width="42" height="11" rx="6"/>
  </g>
 </g>
</g>

<!-- comet and its trail -->
<g id="comet">
 <path id="cometTrail" d=""
 fill="none" stroke="#8adfff" stroke-width="4"
 stroke-linecap="round" opacity=".8"/>
 <circle cx="0" cy="0" r="7" fill="#ffffff"/>
 <circle cx="0" cy="0" r="16" fill="#69caff"
 opacity=".35" filter="url(#glow)"/>
</g>

<g id="sparkles" fill="#ffffff"></g>

</svg>

<script>
const NS="http://www.w3.org/2000/svg";
const stars=document.getElementById("stars");
const sparkles=document.getElementById("sparkles");
const comet=document.getElementById("comet");
const trail=document.getElementById("cometTrail");
const camera=document.getElementById("camera");
const galaxy=document.getElementById("galaxy");

function seeded(n){
 const x=Math.sin(n*127.1+311.7)*43758.5453;
 return x-Math.floor(x);
}

for(let i=0;i<230;i++){
 const x=seeded(i+1)*1280;
 const y=seeded(i+500)*720;
 const r=.6+seeded(i+900)*2.1;
 const c=["#ffffff","#a8b7ff","#e99cff","#72cfff"][i%4];
 const s=document.createElementNS(NS,"circle");
 s.setAttribute("cx",x);
 s.setAttribute("cy",y);
 s.setAttribute("r",r);
 s.setAttribute("fill",c);
 s.dataset.phase=seeded(i+1400)*6.28;
 s.dataset.base=.25+seeded(i+1800)*.65;
 stars.appendChild(s);
}

for(let i=0;i<20;i++){
 const s=document.createElementNS(NS,"circle");
 s.setAttribute("cx",seeded(i+2200)*1280);
 s.setAttribute("cy",seeded(i+2400)*720);
 s.setAttribute("r",1.5+seeded(i+2600)*2.5);
 s.setAttribute("opacity",".8");
 sparkles.appendChild(s);
}

window.renderAt=function(t){
 const turn=t/10;
 const rotation=-13+turn*5+Math.sin(turn*6.28)*1.2;
 galaxy.setAttribute("transform",
  `rotate(${rotation} 640 360)`);
 const zoom=1+.055*(.5-.5*Math.cos(turn*Math.PI));
 camera.setAttribute("transform",
  `translate(640 360) scale(${zoom}) translate(-640 -360)`);

 [...stars.children].forEach(s=>{
  const phase=Number(s.dataset.phase);
  const base=Number(s.dataset.base);
  s.setAttribute("opacity",
   base*(.55+.45*Math.sin(t*1.8+phase)));
 });

 const a=turn*Math.PI*2;
 const x=640+540*Math.cos(a);
 const y=360+230*Math.sin(a);
 comet.setAttribute("transform",`translate(${x} ${y})`);
 const tx=640+540*Math.cos(a-.12);
 const ty=360+230*Math.sin(a-.12);
 trail.setAttribute("d",`M ${tx} ${ty} Q ${x-45} ${y-12} ${x} ${y}`);
};
window.renderAt(0);
</script>
</body>
</html>
